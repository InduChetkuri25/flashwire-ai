name: FLASHWIRE cloud newsroom
on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"
permissions:
  contents: write
concurrency:
  group: flashwire-inbox
  cancel-in-progress: false
jobs:
  newsroom:
    if: github.event.repository.private == false && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      IG_LOGIN_MODE: unified
      IG_API_VERSION: v27.0
      IG_ACCOUNT_ID: "17841449961192703"
      IG_USERNAME: gk._insta
      IMAGE_BASE_URL: https://raw.githubusercontent.com/InduChetkuri25/flashwire-ai/main/artwork
      FLASHWIRE_GITHUB_UPLOAD: "yes"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: ''
      - run: python -m pip install -r requirements.txt
      - name: Restore the existing publish journal
        run: |
          git fetch --depth=1 origin refs/heads/flashwire-inbox
          git worktree add --detach "$RUNNER_TEMP/inbox" FETCH_HEAD
          test -s "$RUNNER_TEMP/inbox/inbox.sqlite"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "FLASHWIRE_DB=$RUNNER_TEMP/inbox/inbox.sqlite" >> "$GITHUB_ENV"
      - run: python -m flashwire scan
      - id: select
        run: python -m flashwire.actions_worker candidates
      - name: Write and check corroborated stories on the runner
        if: steps.select.outputs.eligible == 'true'
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers==4.57.3"
          python -m flashwire.actions_worker draft
      - name: Check account and publish eligible white cards
        if: vars.FLASHWIRE_CLOUD_LIVE == 'yes'
        env:
          FLASHWIRE_LIVE: "yes"
          IG_ACCESS_TOKEN: ${{ secrets.FLASHWIRE_META }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m flashwire preflight --username "$IG_USERNAME"
          python -m flashwire.actions_worker publish
      - name: Save newsroom state
        if: always() && env.FLASHWIRE_DB != ''
        run: python -m flashwire.actions_worker save
